<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Studio - Master Poster Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo-section">
            <span class="diamond-icon">&#9670;</span>
            <h1>ALI STUDIO</h1>
            <span class="subtitle">Master Poster Generator</span>
        </div>
        <div class="alert-section">
            <div class="alert-title"><span class="warning-icon">&#9888;</span> ADOBE STOCK / MICROSTOCK ALERT</div>
            <div class="alert-sub">To avoid Similar issues, customise designs before uploading / Similar issue এড়াতে ডিজাইন কাস্টমাইজ করে নিন</div>
        </div>
        <div class="user-section">
            <div class="avatar"><span class="avatar-letter">M</span> Mohammad</div>
            <button class="upgrade-btn">&#10024; UPGRADE TO PRO</button>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar">
            <div class="control-group">
                <label>NUMBER OF POSTERS</label>
                <select id="poster-count">
                    <option value="4" selected>4 Posters</option>
                    <option value="3">3 Posters</option>
                    <option value="2">2 Posters</option>
                    <option value="1">1 Poster</option>
                </select>
            </div>

            <div class="control-group">
                <div class="slider-container">
                    <label>INDIVIDUAL VERTICAL <span id="val-vertical">55%</span></label>
                    <input type="range" id="vertical" min="0" max="100" value="55" data-suffix="%">
                </div>
                <div class="slider-container">
                    <label>INDIVIDUAL HORIZONTAL <span id="val-horizontal">5%</span></label>
                    <input type="range" id="horizontal" min="0" max="100" value="5" data-suffix="%">
                </div>
            </div>

            <div class="accordion" id="acc-1">POSTER 1 <span class="arrow">&#9662;</span></div>
            <div class="accordion" id="acc-2">POSTER 2 <span class="arrow">&#9662;</span></div>
            <div class="accordion" id="acc-3">POSTER 3 <span class="arrow">&#9662;</span></div>
            <div class="accordion" id="acc-4">POSTER 4 <span class="arrow">&#9662;</span></div>

            <div class="settings-header">
                <h3>&#9881; SETTINGS</h3>
            </div>

            <div class="control-group">
                <label>DESIGN MODE</label>
                <select id="design-mode">
                    <option value="mixed">Mixed Geometric</option>
                    <option value="watercolor">Watercolor Bubble</option>
                    <option value="fluid">Fluid Shapes</option>
                    <option value="blob">Blob Design</option>
                    <option value="liquid">Liquid Gradient</option>
                    <option value="mesh">Mesh Gradient</option>
                    <option value="wave">Wave Pattern</option>
                    <option value="geometric">Geometric Pattern</option>
                    <option value="papercut">Paper Cut Style</option>
                    <option value="bauhaus">Bauhaus Style</option>
                    <option value="dot">Dot Pattern</option>
                    <option value="polka">Polka Dot</option>
                    <option value="halftone">Halftone Pattern</option>
                    <option value="hexagon">Hexagon Pattern</option>
                    <option value="spiral">Spiral Pattern</option>
                </select>
            </div>

            <div class="control-group">
                <div class="slider-container">
                    <label>BASE DENSITY <span id="val-density">19</span></label>
                    <input type="range" id="density" min="1" max="50" value="19" data-suffix="">
                </div>
                <div class="slider-container">
                    <label>WAVE FREQUENCY <span id="val-frequency">18%</span></label>
                    <input type="range" id="frequency" min="0" max="100" value="18" data-suffix="%">
                </div>
                <div class="slider-container">
                    <label>BASE THICKNESS <span id="val-thickness">18PX</span></label>
                    <input type="range" id="thickness" min="1" max="100" value="18" data-suffix="PX">
                </div>
                <div class="slider-container">
                    <label>AMPLITUDE <span id="val-amplitude">179%</span></label>
                    <input type="range" id="amplitude" min="0" max="300" value="179" data-suffix="%">
                </div>
                <div class="slider-container">
                    <label>PHASE SHIFT <span id="val-phase">33&deg;</span></label>
                    <input type="range" id="phase" min="0" max="360" value="33" data-suffix="&deg;">
                </div>
                <div class="slider-container">
                    <label>CHAOS <span id="val-chaos">73%</span></label>
                    <input type="range" id="chaos" min="0" max="100" value="73" data-suffix="%">
                </div>
            </div>
            <button class="download-btn">DOWNLOAD SVG</button>
        </aside>

        <main class="canvas-area">
            <div class="canvas-board">
                <div class="poster" id="poster-1"><canvas width="300" height="450"></canvas></div>
                <div class="poster" id="poster-2"><canvas width="300" height="450"></canvas></div>
                <div class="poster" id="poster-3"><canvas width="300" height="450"></canvas></div>
                <div class="poster" id="poster-4"><canvas width="300" height="450"></canvas></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
