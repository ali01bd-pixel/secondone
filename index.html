<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Poster Lab</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="logo">COLOR POSTER LAB</div>
        <nav class="top-nav">
            <button class="nav-btn active" data-tab="generator">Generator</button>
            <button class="nav-btn" data-tab="gallery">Gallery & History</button>
            <button class="nav-btn" data-tab="favorites">Favorites</button>
        </nav>
    </header>

    <main class="app-body">
        <aside class="control-panel">
            <div class="control-group">
                <label for="aspect-ratio">Aspect Ratio</label>
                <select id="aspect-ratio">
                    <option value="1:1">1:1 (Square - 3240x3240)</option>
                    <option value="4:5" selected>4:5 (Portrait - 3240x4050)</option>
                    <option value="9:16">9:16 (Story - 3240x5760)</option>
                    <option value="16:9">16:9 (Wide - 5760x3240)</option>
                    <option value="2:3">2:3 (Poster - 3600x5400)</option>
                    <option value="A4">A4 (Print - 7440x10524)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="design-mode">Design Mode</label>
                <select id="design-mode">
                    <option value="mixed">Mixed (Auto)</option>
                    <option value="solid">Solid Colors Only</option>
                    <option value="gradient">Gradient Focused</option>
                </select>
            </div>

            <div class="control-group">
                <label for="design-style">Composition Style</label>
                <select id="design-style">
                    <option value="random">Random Professional</option>
                    <option value="minimalist">Minimalist Grid</option>
                    <option value="geometric">Geometric Blocks</option>
                    <option value="diagonal">Diagonal Split</option>
                    <option value="abstract">Abstract Shapes</option>
                    <option value="editorial">Modern Editorial</option>
                </select>
            </div>

            <div class="control-group">
                <label for="color-palette">Color Palette</label>
                <select id="color-palette">
                    </select>
            </div>
            
            <div class="control-group">
                <label for="custom-colors" style="font-size: 0.8rem; opacity: 0.8;">Or Custom Colors (Comma separated HEX):</label>
                <input type="text" id="custom-colors" placeholder="#1E3A8A, #F59E0B...">
            </div>

            <div class="control-group">
                <label for="complexity">Complexity / Density</label>
                <select id="complexity">
                    <option value="low">Low (Minimal)</option>
                    <option value="medium" selected>Medium (Balanced)</option>
                    <option value="high">High (Complex)</option>
                </select>
            </div>

            <div class="action-buttons">
                <button id="btn-generate" class="primary-btn">GENERATE DESIGN</button>
                <button id="btn-generate-10" class="secondary-btn">GENERATE 10</button>
                <button id="btn-similar" class="secondary-btn">GENERATE SIMILAR</button>
                <button id="btn-randomize" class="tertiary-btn">Randomize Settings</button>
            </div>

            <div class="seed-group">
                <label for="seed-input">Design Seed</label>
                <div class="seed-input-row">
                    <input type="text" id="seed-input" readonly>
                    <button id="btn-copy-seed">Copy</button>
                </div>
            </div>
        </aside>

        <section class="preview-area" id="tab-generator">
            <div class="canvas-wrapper">
                <canvas id="poster-canvas"></canvas>
            </div>
            
            <div class="preview-controls">
                <div class="metadata" id="design-metadata">
                    <h2 id="meta-name">Design Name</h2>
                    <p id="meta-details">Palette: Default | Style: Mixed</p>
                </div>
                <div class="preview-actions">
                    <button id="btn-favorite" class="icon-btn" title="Favorite">♡</button>
                    <button id="btn-download" class="icon-btn" title="Download PNG">⭳</button>
                    <button id="btn-download-svg" class="icon-btn" title="Download Vector SVG" style="font-size: 0.8rem; font-weight: bold;">SVG</button>
                </div>
            </div>
        </section>

        <section class="grid-area hidden" id="tab-gallery">
            <div class="tab-header">
                <h2>Recent Generations</h2>
                <button id="btn-download-all" class="secondary-btn">Download All</button>
            </div>
            <div class="gallery-grid" id="history-grid"></div>
        </section>

        <section class="grid-area hidden" id="tab-favorites">
            <div class="tab-header">
                <h2>Saved Designs</h2>
                <button id="btn-clear-favorites" class="tertiary-btn">Clear Favorites</button>
            </div>
            <div class="gallery-grid" id="favorites-grid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
